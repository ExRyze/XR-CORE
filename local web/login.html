<!DOCTYPE html>
<html lang="en">

<head>
    <script type="module" src="/src/main.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | XR-Device</title>
    <link rel="icon" type="image/png" href="/logo.png">
</head>

<body class="min-h-screen flex items-center justify-center bg-background text-foreground font-sans antialiased px-4">
    <main class="w-full max-w-md">
        <section class="bg-card border border-border rounded-2xl p-7 sm:p-9 shadow-2xl">
            <div class="flex flex-col items-center text-center mb-8">
                <img src="/logo.png" alt="ExRyze Logo" class="w-16 h-16 object-contain rounded-xl mb-4">
                <h1 id="device-title" class="text-xs font-semibold tracking-[0.2em] uppercase text-primary">ExRyze
                    Devices</h1>
                <p class="text-2xl font-bold text-foreground mt-2">Sign in to your device</p>
                <p class="text-sm text-muted-foreground mt-2">Enter your device credentials to continue.</p>
            </div>

            <form id="login-form" class="space-y-5">
                <div>
                    <label for="username"
                        class="block text-xs font-semibold text-muted-foreground uppercase tracking-wider mb-2">Username</label>
                    <input id="username" name="username" type="text" autocomplete="username" required autofocus
                        class="w-full bg-background border border-border rounded-xl px-3.5 py-3 text-sm text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary"
                        placeholder="Username">
                </div>
                <div>
                    <label for="password"
                        class="block text-xs font-semibold text-muted-foreground uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <input id="password" name="password" type="password" autocomplete="current-password"
                            class="w-full bg-background border border-border rounded-xl px-3.5 py-3 pr-12 text-sm text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary"
                            placeholder="Password">
                        <button id="toggle-password" type="button" aria-label="Show password" aria-pressed="false"
                            title="Show password"
                            class="absolute inset-y-0 right-3 flex items-center text-muted-foreground hover:text-foreground transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-eye">
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <p id="login-error" class="hidden text-sm text-danger" role="alert"></p>
                <button id="login-button" type="submit"
                    class="w-full flex items-center justify-center gap-2 bg-primary hover:bg-primary/90 text-primary-foreground font-semibold px-4 py-3 rounded-xl text-sm transition-colors shadow-md">
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    <span>Sign in</span>
                </button>
            </form>
        </section>
        <p class="text-center text-xs text-muted-foreground mt-5">Secure access to your local device dashboard</p>
    </main>

    <script type="module">lucide.createIcons();
        const form = document.getElementById('login-form');
        const errorMessage = document.getElementById('login-error');
        const button = document.getElementById('login-button');
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('toggle-password');

        fetch('/api/device/public-status')
            .then((response) => response.ok ? response.json() : Promise.reject())
            .then((device) => {
                if (device.name) document.getElementById('device-title').textContent = device.name;
            })
            .catch(() => {
                document.getElementById('device-title').textContent = 'ExRyze Devices';
            });

        passwordToggle.addEventListener('click', () => {
            const showPassword = passwordInput.type === 'password';
            passwordInput.type = showPassword ? 'text' : 'password';
            passwordToggle.setAttribute('aria-pressed', String(showPassword));
            passwordToggle.setAttribute('aria-label', showPassword ? 'Hide password' : 'Show password');
            passwordToggle.title = showPassword ? 'Hide password' : 'Show password';
            passwordToggle.innerHTML = showPassword
                ? '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-off"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.94 10.94 0 0 1 12 5c6.5 0 10 7 10 7s-1.23 2.45-3.13 4.47"/><path d="M6.61 6.61A16.29 16.29 0 0 0 2 12s3.5 7 10 7a10.9 10.9 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>'
                : '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorMessage.classList.add('hidden');
            button.disabled = true;
            button.querySelector('span').textContent = 'Signing in...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
                    body: new URLSearchParams(new FormData(form))
                });
                const result = await response.json();
                if (!response.ok || result.status !== 'ok') throw new Error(result.message || 'Unable to sign in.');
                window.location.replace('/');
            } catch (error) {
                errorMessage.textContent = error.message || 'Unable to connect to the device.';
                errorMessage.classList.remove('hidden');
                button.disabled = false;
                button.querySelector('span').textContent = 'Sign in';
            }
        });
    </script>
</body>

</html>
